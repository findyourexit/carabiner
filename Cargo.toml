[package]
name = "carabiner"
version = "0.1.5"
edition = "2021"
rust-version = "1.82"
description = "Unified AI rules management CLI"
license = "MIT"
repository = "https://github.com/findyourexit/carabiner"
homepage = "https://github.com/findyourexit/carabiner"
documentation = "https://tomlarcher.com/carabiner/"
readme = "README.md"
keywords = ["ai", "rules", "agents", "codegen", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".cargo/",
  ".editorconfig",
  ".gitattributes",
  ".gitmessage",
  ".github/",
  "assets/",
  "schemas/",
  "rust-toolchain.toml",
  "clippy.toml",
  "rustfmt.toml",
  "deny.toml",
  "zensical.toml",
  "site/",
  ".venv/",
]

[lib]
name = "carabiner"
path = "src/lib.rs"

[[bin]]
name = "carabiner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "=4.5.61", features = ["derive"] }
flate2 = "1.1.10"
indexmap = "=2.13.1"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4.46"
# TOML 1.1 requires Rust 1.85; keep the Rust 1.82 MSRV.
toml = "~1.0.7"
walkdir = "2.5"
