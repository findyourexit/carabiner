name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security-reporting link in the issue chooser.
  - type: input
    id: version
    attributes:
      label: Carabiner version or commit
      placeholder: "v0.1.0 or 0123456789abcdef"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: "bash 5.x / zsh 5.x / PowerShell 7"
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project directory.
        2. Run `carabiner init`.
        3. Run `carabiner generate --targets claudecode`.
        4. Describe what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Configuration files, full error output, or relevant excerpts.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
