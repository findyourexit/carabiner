name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # renovate: datasource=rust-version depName=rust versioning=rust-release-channel
  RUST_TOOLCHAIN: "1.88.0"
  # renovate: datasource=crate depName=cargo-deny versioning=semver
  CARGO_DENY_VERSION: "0.20.2"


jobs:
  msrv:
    name: Rust 1.82.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        shell: bash
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup override set 1.82.0

      - name: Check all targets at MSRV
        run: cargo check --all-targets --locked

      - name: Run tests at MSRV
        run: cargo test --locked

  verify:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy,rustfmt
          rustup override set "${RUST_TOOLCHAIN}"
          rustc --version --verbose

      - name: Install cargo-deny
        shell: bash
        run: cargo +stable install cargo-deny --version "${CARGO_DENY_VERSION}" --locked

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run strict Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify package
        run: cargo package --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check
